# SonarQube Cloud (CI-based analysis from .github/workflows/ci.yml, job "test"; it runs only when the SONAR_TOKEN
# secret exists). Setup steps: README "Development". Confirm both keys on the project's SonarQube Cloud page.
sonar.organization=rgonzal92
sonar.projectKey=rgonzal92_qa-sdet
sonar.projectName=qa-sdet

sonar.sources=lib,hooks,bin
sonar.tests=tests
# the fixture app and fixture source are test data (planted bugs and fake secrets), not code to analyse
sonar.exclusions=tests/fixture/**,tests/fixture-src/**
sonar.test.exclusions=tests/fixture/**,tests/fixture-src/**
sonar.python.version=3.9,3.10,3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
