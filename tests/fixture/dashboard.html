<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Signals</title></head>
<body><nav><a href="#/signals">Signals</a> | <a href="#/summary">Summary</a></nav>
<main id="main"></main>
<footer>Build <span id="build">1.0.0</span></footer>
<script>
const store={signals:Array.from({length:10},(_,i)=>({name:'Signal '+(i+1),active:i<8})),filter:''};
const shown=()=>store.signals.filter(s=>s.name.toLowerCase().includes(store.filter));
const main=document.getElementById('main');
function alarms(el){el.textContent='Loading alarms';
 fetch('api/alarms.json?try='+Date.now()).then(r=>{if(!r.ok)throw new Error('The alarm service answered '+r.status);return r.json()})
  .then(d=>{el.textContent=d.length?d.length+' open alarms':'No open alarms'})
  .catch(e=>{el.innerHTML='<span role="alert">Alarms unavailable: '+e.message+'</span> <button>Retry</button>';el.querySelector('button').onclick=()=>alarms(el)});}
function render(){const r=location.hash.replace(/^#/,'')||'/signals';
 if(r==='/summary'){const total=shown().length,active=store.signals.filter(s=>s.active).length;
  main.innerHTML='<h1>Summary</h1><section aria-label="Signals"><p>Total: '+total+'</p><p>Active: '+active+' ('+Math.round(active/total*100)+'%)</p></section><section aria-label="Alarms" id="alarms"></section>';
  alarms(document.getElementById('alarms'));}
 else{main.innerHTML='<h1>Signals</h1><label>Filter signals <input type="search" id="f"></label><ul id="l"></ul>';
  const f=document.getElementById('f'),l=document.getElementById('l'),list=()=>l.innerHTML=shown().map(s=>'<li>'+s.name+(s.active?'':' (off)')+'</li>').join('');
  f.value=store.filter;f.oninput=()=>{store.filter=f.value.toLowerCase();list()};list();}}
addEventListener('hashchange',render);render();
</script></body></html>
