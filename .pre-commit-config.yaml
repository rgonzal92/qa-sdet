# Git pre-commit checks (`make hooks` installs them): fast and deterministic. These are Git's hooks, separate from
# the plugin's Claude Code hooks in hooks/. Keep the ruff rev equal to ruff's pin in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$  # two trailing spaces are a Markdown line break
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # staged changes only; reads .gitleaks.toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: plugin-contracts
        name: plugin docs and code agree (tests/test_docs.py)
        entry: python3 -m unittest discover -s tests -p test_docs.py
        language: system
        pass_filenames: false
        files: ^(skills|agents|references|hooks|lib|bin)/|^README\.md$|^\.claude-plugin/
