# Weekly update PRs for the dev tools (uv.lock) and the workflow actions (SHA pins). The plugin has no runtime
# dependencies. Not covered here: the pre-commit revs (`uv run pre-commit autoupdate`) and the gitleaks and
# actionlint versions and checksums in the Makefile.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      - dependency-name: mypy
        update-types: ["version-update:semver-major"] # 2.x can't check against Python 3.9, the runtime floor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
